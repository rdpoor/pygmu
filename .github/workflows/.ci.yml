name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies (dev)
        run: |
          pipenv --python ${{ matrix.python-version }}
          pipenv install --dev

      - name: Lint (ruff)
        run: |
          pipenv run python -m ruff --version || pipenv run pip install ruff
          pipenv run ruff src tests

      - name: Type check (mypy)
        run: |
          pipenv run python -m mypy --version || pipenv run pip install mypy
          pipenv run mypy src

      - name: Run tests
        env:
          # Enable strict contract checks in CI:
          PYGMU_STRICT: "1"
        run: |
          pipenv run pytest -q

      - name: Coverage (text + XML)
        run: |
          pipenv run pip install coverage
          pipenv run coverage run -m pytest
          pipenv run coverage report -m
          pipenv run coverage xml

      # Optional: upload coverage to codecov (uncomment after adding CODECOV_TOKEN secret)
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: ./coverage.xml
      #     fail_ci_if_error: true
