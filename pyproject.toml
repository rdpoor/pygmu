[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygmu"
version = "0.1.0"
description = "Python Generative Music framework (composer-first, pull-render graph)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "R. D. Poor" }]
license = { text = "MIT" }
keywords = ["audio", "music", "DSP", "composition", "generative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=1.23",
  # Add optional runtime deps as you integrate them, e.g.:
  # "soundfile>=0.12",
  # "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest", "coverage", "mypy", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygmu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
